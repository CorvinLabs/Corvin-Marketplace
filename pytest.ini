# Corvin-Marketplace test configuration.
#
# Every plugin ships its own ``tests/`` package (operator rule: the full plugin
# source lives here, incl. tests). Two things this file makes work:
#
# * ``--import-mode=importlib`` — dozens of ``tests/test_<name>.py`` modules
#   share basenames across plugins; the default prepend mode collides on the
#   ``tests`` package name and refuses to collect most of them.
# * ``asyncio_mode = auto`` — plugin tests are ``async def`` without an explicit
#   ``@pytest.mark.asyncio``; strict mode errors at setup ("async fixture not
#   handled"), which is how a 93-error run read as "7 failed" (2026-09-06).
[pytest]
testpaths = plugins
python_files = test_*.py
addopts = --import-mode=importlib -p no:cacheprovider
asyncio_mode = auto
