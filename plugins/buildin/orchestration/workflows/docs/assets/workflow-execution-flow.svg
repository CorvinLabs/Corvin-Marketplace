<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .title { font-size: 22px; font-weight: bold; }
      .step-label { font-size: 11px; text-anchor: middle; }
      .arrow { fill: none; stroke: #666; stroke-width: 2; marker-end: url(#arrowhead); }
      .vertical-arrow { fill: none; stroke: #999; stroke-width: 2; marker-end: url(#arrowhead); stroke-dasharray: 5,5; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#666"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="35" class="title" text-anchor="middle">Typical Workflow Execution: Daily News Digest</text>

  <!-- Design & Scheduling Phase -->
  <text x="100" y="70" style="font-size: 12px; font-weight: bold;">DESIGN & SCHEDULING PHASE</text>
  <line x1="20" y1="80" x2="320" y2="80" stroke="#ddd" stroke-width="1"/>

  <!-- Step 1: Designer -->
  <circle cx="100" cy="140" r="40" fill="#0066CC" stroke="#004499" stroke-width="2"/>
  <text x="100" y="145" style="font-size: 12px; text-anchor: middle; fill: white; font-weight: bold;">1</text>
  <text x="100" y="195" class="step-label">Designer</text>
  <text x="100" y="210" class="step-label">"Create daily</text>
  <text x="100" y="223" class="step-label">digest workflow"</text>

  <!-- Arrow -->
  <line x1="140" y1="140" x2="200" y2="140" class="arrow"/>

  <!-- Step 2: Claude Chat -->
  <circle cx="280" cy="140" r="40" fill="#9933CC" stroke="#663399" stroke-width="2"/>
  <text x="280" y="145" style="font-size: 12px; text-anchor: middle; fill: white; font-weight: bold;">2</text>
  <text x="280" y="195" class="step-label">Claude</text>
  <text x="280" y="210" class="step-label">Chat</text>
  <text x="280" y="223" class="step-label">"YAML generated"</text>

  <!-- Arrow down to scheduling -->
  <line x1="280" y1="180" x2="280" y2="250" class="vertical-arrow"/>

  <!-- Step 3: Scheduled -->
  <circle cx="280" cy="310" r="40" fill="#FF6600" stroke="#CC5500" stroke-width="2"/>
  <text x="280" y="315" style="font-size: 12px; text-anchor: middle; fill: white; font-weight: bold;">3</text>
  <text x="280" y="365" class="step-label">Scheduled</text>
  <text x="280" y="378" class="step-label">"09:00 UTC daily"</text>

  <!-- Execution Phase Header -->
  <text x="700" y="70" style="font-size: 12px; font-weight: bold;">EXECUTION PHASE (Next Day, 09:00 UTC)</text>
  <line x1="500" y1="80" x2="1200" y2="80" stroke="#ddd" stroke-width="1"/>

  <!-- Execution step boxes -->
  <!-- Node 1: Fetch News -->
  <rect x="520" y="110" width="130" height="70" fill="#E8F8E8" stroke="#009900" stroke-width="1" rx="3"/>
  <text x="585" y="130" style="font-size: 10px; text-anchor: middle; font-weight: bold;">Node 1</text>
  <text x="585" y="145" style="font-size: 9px; text-anchor: middle;">Fetch News</text>
  <text x="585" y="160" style="font-size: 8px; text-anchor: middle; fill: #666;">300 KB JSON</text>
  <text x="585" y="172" style="font-size: 8px; text-anchor: middle; fill: #666;">10 articles</text>

  <line x1="650" y1="145" x2="700" y2="145" class="arrow"/>

  <!-- Node 2: Summarize -->
  <rect x="700" y="110" width="130" height="70" fill="#E8F8E8" stroke="#009900" stroke-width="1" rx="3"/>
  <text x="765" y="130" style="font-size: 10px; text-anchor: middle; font-weight: bold;">Node 2</text>
  <text x="765" y="145" style="font-size: 9px; text-anchor: middle;">Summarize</text>
  <text x="765" y="160" style="font-size: 8px; text-anchor: middle; fill: #666;">Claude Opus</text>
  <text x="765" y="172" style="font-size: 8px; text-anchor: middle; fill: #666;">~2 sec</text>

  <line x1="830" y1="145" x2="880" y2="145" class="arrow"/>

  <!-- Node 3: Format Email -->
  <rect x="880" y="110" width="130" height="70" fill="#E8F8E8" stroke="#009900" stroke-width="1" rx="3"/>
  <text x="945" y="130" style="font-size: 10px; text-anchor: middle; font-weight: bold;">Node 3</text>
  <text x="945" y="145" style="font-size: 9px; text-anchor: middle;">Format Email</text>
  <text x="945" y="160" style="font-size: 8px; text-anchor: middle; fill: #666;">HTML template</text>
  <text x="945" y="172" style="font-size: 8px; text-anchor: middle; fill: #666;">150 KB</text>

  <line x1="945" y1="180" x2="945" y2="230" class="vertical-arrow"/>

  <!-- Node 4: Approval Gate -->
  <rect x="880" y="230" width="130" height="70" fill="#F8E8E8" stroke="#FF6600" stroke-width="2" rx="3"/>
  <text x="945" y="250" style="font-size: 10px; text-anchor: middle; font-weight: bold;">Node 4</text>
  <text x="945" y="265" style="font-size: 9px; text-anchor: middle;">Approval Gate</text>
  <text x="945" y="280" style="font-size: 8px; text-anchor: middle; fill: #CC5500;">Human review</text>
  <text x="945" y="292" style="font-size: 8px; text-anchor: middle; fill: #CC5500;">timeout 60 min</text>

  <line x1="880" y1="265" x2="830" y2="265" class="arrow"/>

  <!-- Node 5: Send Email -->
  <rect x="700" y="230" width="130" height="70" fill="#E8F4F8" stroke="#0066CC" stroke-width="1" rx="3"/>
  <text x="765" y="250" style="font-size: 10px; text-anchor: middle; font-weight: bold;">Node 5</text>
  <text x="765" y="265" style="font-size: 9px; text-anchor: middle;">Send Email</text>
  <text x="765" y="280" style="font-size: 8px; text-anchor: middle; fill: #666;">Slack API</text>
  <text x="765" y="292" style="font-size: 8px; text-anchor: middle; fill: #666;">~0.5 sec</text>

  <line x1="700" y1="265" x2="650" y2="265" class="arrow"/>

  <!-- Completion -->
  <circle cx="610" cy="265" r="30" fill="#66BB6A" stroke="#33AA33" stroke-width="2"/>
  <text x="610" y="270" style="font-size: 16px; text-anchor: middle; fill: white; font-weight: bold;">✓</text>
  <text x="610" y="310" style="font-size: 9px; text-anchor: middle; font-weight: bold;">Completed</text>
  <text x="610" y="323" style="font-size: 8px; text-anchor: middle; fill: #666;">Total: 4.2 sec</text>

  <!-- Timeline annotation -->
  <text x="520" y="400" style="font-size: 10px; fill: #666;">Node execution: Sequential by default. Parallel allowed with explicit config.</text>
  <text x="520" y="418" style="font-size: 10px; fill: #666;">Audit trail: Every node start/end logged with input, output, latency, status.</text>

  <!-- Metrics box -->
  <rect x="520" y="440" width="250" height="50" fill="#F9F9F9" stroke="#ddd" stroke-width="1" rx="3"/>
  <text x="535" y="455" style="font-size: 10px; font-weight: bold;">Typical Metrics</text>
  <text x="535" y="470" style="font-size: 9px;">Total duration: 4.2 seconds</text>
  <text x="535" y="482" style="font-size: 9px;">Claude tokens: ~2,500 (cost: ~$0.015)</text>

  <!-- Error handling annotation -->
  <rect x="800" y="440" width="250" height="50" fill="#FFF3E0" stroke="#FF9800" stroke-width="1" rx="3"/>
  <text x="815" y="455" style="font-size: 10px; font-weight: bold;">Error Handling</text>
  <text x="815" y="470" style="font-size: 9px;">Node failure → halt workflow (or retry)</text>
  <text x="815" y="482" style="font-size: 9px;">Approval timeout → pause indefinitely</text>
</svg>
