plugin_id: semantic-context-retriever
plugin_type: context_retriever
version: 0.1.0
display_name: Semantic Context Retriever
origin: builtin
boot_layer: installed
locality: local
network_egress: none
egress_hosts: []
pii_risk: none
requires_consent: false
audit_required: true
capabilities_version: '1.0'
capabilities:
- id: context.semantic_retrieval
  type: context_source
  description: Retrieve semantically similar context items from memory using BM25
    ranking
  parameters:
    type: object
    required:
    - query
    properties:
      query:
        type: string
        description: Semantic query for retrieval
      top_k:
        type: integer
        default: 5
      min_similarity:
        type: number
        minimum: 0.0
        maximum: 1.0
        default: 0.7
  returns:
    type: object
    properties:
      items:
        type: array
      total_count:
        type: integer
  slo_latency_ms: 500
  slo_error_rate: 0.01
  audit_event: plugin.context_semantic_retrieved
  on_failure: fail_closed
  added_in: '1.0'
