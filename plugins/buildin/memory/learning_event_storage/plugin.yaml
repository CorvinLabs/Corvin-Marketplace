plugin_id: learning_event_storage
version: 0.1.0
display_name: Learning Event Storage
origin: builtin
boot_layer: installed
locality: local
network_egress: none
egress_hosts: []
pii_risk: none
requires_consent: false
audit_required: true
capabilities_version: '1.0'
capabilities:
- id: event.learning_storage
  type: event_store
  description: Store immutable learning events
  parameters:
    type: object
    required:
    - event_type
    - event_data
    properties:
      event_type:
        type: string
        enum:
        - feedback
        - outcome
        - confidence
        - preference
        - metric
      event_data:
        type: object
      tenant_id:
        type: string
  returns:
    type: object
  slo_latency_ms: 50
  slo_error_rate: 0.0
  audit_event: plugin.learning_event_stored
  on_failure: fail_closed
  added_in: '1.0'
