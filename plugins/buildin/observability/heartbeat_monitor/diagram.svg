<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <style>
      .box { fill: #e8f4f8; stroke: #1a5a7a; stroke-width: 2; }
      .title { font-size: 20px; font-weight: bold; fill: #1a5a7a; }
      .label { font-size: 13px; fill: #333; }
      .pulse { font-size: 11px; fill: #1a5a7a; }
      .arrow { stroke: #1a5a7a; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .latency { font-size: 12px; fill: #d9534f; font-weight: bold; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#1a5a7a" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" class="title">Heartbeat Monitor Architecture</text>

  <!-- Heartbeat Sources -->
  <rect x="50" y="80" width="300" height="60" class="box" rx="5"/>
  <text x="200" y="105" text-anchor="middle" class="label">Heartbeat Pulses (5-min cadence)</text>
  <text x="200" y="125" text-anchor="middle" class="pulse">From 13+ Brain subsystems and services</text>

  <!-- Arrows down -->
  <path d="M 200 140 L 200 180" class="arrow"/>

  <!-- Plugin Core -->
  <rect x="50" y="180" width="700" height="100" class="box" rx="5"/>
  <text x="400" y="210" text-anchor="middle" class="title">HeartbeatMonitor</text>
  <text x="400" y="235" text-anchor="middle" class="label">Presence Tracker + Stale Detection + Gap Analysis</text>
  <text x="400" y="260" text-anchor="middle" class="latency">&lt;0.08ms latency</text>

  <!-- Latency annotation -->
  <text x="680" y="235" class="latency">⚡ Critical</text>

  <!-- Arrow down -->
  <path d="M 400 280 L 400 320" class="arrow"/>

  <!-- Presence Buffer -->
  <rect x="100" y="320" width="600" height="80" class="box" rx="5"/>
  <text x="400" y="345" text-anchor="middle" class="label">Circular Presence &amp; Gap Buffer (5k events)</text>
  <text x="400" y="370" text-anchor="middle" class="label">Tracks: last_seen_timestamp, gap_duration, stale_status per component</text>

  <!-- Arrows down -->
  <path d="M 400 400 L 400 440" class="arrow"/>

  <!-- Diagnostics API -->
  <rect x="40" y="440" width="330" height="120" class="box" rx="5"/>
  <text x="205" y="465" text-anchor="middle" class="label">get_diagnostics()</text>
  <text x="205" y="490" text-anchor="middle" class="label">get_responsiveness_score()</text>
  <text x="205" y="515" text-anchor="middle" class="label">get_stale_components()</text>
  <text x="205" y="540" text-anchor="middle" class="label">health_check()</text>

  <!-- Status Output -->
  <rect x="430" y="440" width="330" height="120" class="box" rx="5"/>
  <text x="595" y="465" text-anchor="middle" class="label">Responsiveness Snapshot</text>
  <text x="595" y="490" text-anchor="middle" class="label">active_components, stale_components</text>
  <text x="595" y="515" text-anchor="middle" class="label">responsiveness_score (0-1)</text>
  <text x="595" y="540" text-anchor="middle" class="label">gap_duration, health</text>
</svg>
