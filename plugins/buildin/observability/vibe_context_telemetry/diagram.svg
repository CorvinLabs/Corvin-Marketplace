<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <style>
      .box { fill: #e8f4f8; stroke: #1a5a7a; stroke-width: 2; }
      .title { font-size: 20px; font-weight: bold; fill: #1a5a7a; }
      .label { font-size: 12px; fill: #333; }
      .operation { font-size: 10px; fill: #1a5a7a; }
      .arrow { stroke: #1a5a7a; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .latency { font-size: 12px; fill: #d9534f; font-weight: bold; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#1a5a7a" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" class="title">Vibe Context Telemetry Architecture</text>

  <!-- Context Operations -->
  <rect x="50" y="80" width="160" height="60" class="box" rx="5"/>
  <text x="130" y="105" text-anchor="middle" class="label">Context</text>
  <text x="130" y="125" text-anchor="middle" class="label">Create</text>

  <rect x="240" y="80" width="160" height="60" class="box" rx="5"/>
  <text x="320" y="105" text-anchor="middle" class="label">Context</text>
  <text x="320" y="125" text-anchor="middle" class="label">Modify</text>

  <rect x="430" y="80" width="160" height="60" class="box" rx="5"/>
  <text x="510" y="105" text-anchor="middle" class="label">Context</text>
  <text x="510" y="125" text-anchor="middle" class="label">Sync</text>

  <rect x="620" y="80" width="130" height="60" class="box" rx="5"/>
  <text x="685" y="105" text-anchor="middle" class="label">Context</text>
  <text x="685" y="125" text-anchor="middle" class="label">Propagate</text>

  <!-- Arrows down -->
  <path d="M 130 140 L 200 180" class="arrow"/>
  <path d="M 320 140 L 400 180" class="arrow"/>
  <path d="M 510 140 L 600 180" class="arrow"/>
  <path d="M 685 140 L 600 180" class="arrow"/>

  <!-- Plugin Core -->
  <rect x="50" y="180" width="700" height="100" class="box" rx="5"/>
  <text x="400" y="210" text-anchor="middle" class="title">VibeContextTelemetry</text>
  <text x="400" y="235" text-anchor="middle" class="label">Latency Measurement + Memory Tracking + Access Pattern Analysis</text>
  <text x="400" y="260" text-anchor="middle" class="latency">&lt;0.08ms latency</text>

  <!-- Latency annotation -->
  <text x="680" y="235" class="latency">⚡ Critical</text>

  <!-- Arrow down -->
  <path d="M 400 280 L 400 320" class="arrow"/>

  <!-- Performance Buffer -->
  <rect x="80" y="320" width="640" height="80" class="box" rx="5"/>
  <text x="400" y="345" text-anchor="middle" class="label">Context Performance Buffer (50k events)</text>
  <text x="400" y="370" text-anchor="middle" class="operation">Histograms: create (215), modify (7250), sync (752), propagate (157)</text>

  <!-- Arrows down -->
  <path d="M 400 400 L 400 440" class="arrow"/>

  <!-- Diagnostics API -->
  <rect x="40" y="440" width="330" height="120" class="box" rx="5"/>
  <text x="205" y="465" text-anchor="middle" class="label">get_diagnostics()</text>
  <text x="205" y="490" text-anchor="middle" class="label">get_update_metrics(type)</text>
  <text x="205" y="515" text-anchor="middle" class="label">get_slow_updates(threshold)</text>
  <text x="205" y="540" text-anchor="middle" class="label">health_check()</text>

  <!-- Status Output -->
  <rect x="430" y="440" width="330" height="120" class="box" rx="5"/>
  <text x="595" y="465" text-anchor="middle" class="label">Context Performance Snapshot</text>
  <text x="595" y="490" text-anchor="middle" class="label">avg_update_latency_ms, p95/p99</text>
  <text x="595" y="515" text-anchor="middle" class="label">memory_per_update, peak_context_size</text>
  <text x="595" y="540" text-anchor="middle" class="label">access_pattern, health</text>
</svg>
