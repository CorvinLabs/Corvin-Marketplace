plugin_id: video_producer
plugin_type: web_surface
version: 1.8.0
display_name: CorvinTV
description: "CorvinTV (formerly Video Producer): create narrated MP4s from a task description - storyboard
  written by the native Claude Code engine (the host's signed-in claude CLI; no other LLM, no fallback), narration
  by the CorvinOS voice chain (the same as chat: OpenAI, edge-tts, Piper), animated web slides, ffmpeg assembly.
  First-party plugin of the buildin tier: a fresh installation installs and enables it, and the operator can
  disable or uninstall it at any time. See USER-GUIDE.md and docs/."
origin: vetted
boot_layer: installed
locality: local
network_egress: external
egress_hosts:
  # Every host a job can reach, each gated by the console's own L34/L35 pre-spawn checks before the job
  # starts (egress_gate.DEFAULT_ENGINE_HOSTS). Nothing is contacted at boot or in the background.
  - api.anthropic.com         # the storyboard: the host's Claude Code CLI (the only LLM engine)
  - api.openai.com            # narration, CorvinOS chain tier 1 (needs the operator's OpenAI key)
  - speech.platform.bing.com  # narration, CorvinOS chain tier 2, edge-tts (Microsoft voices, no key)
  # tier 3, Piper, is local; CORVIN_TTS_LOCAL_ONLY=1 keeps the narration on it
pii_risk: medium   # the narration text (derived from the operator's task) goes to the TTS host; never the task's files
requires_consent: false
audit_required: true
infrastructure_plugin: false
orchestration_support: true
settings_schema:
  type: object
  properties:
    tts_engine:
      type: string
      enum: [auto, openai, gtts]
      default: auto
      description: Narration engine -- auto, the CorvinOS voice chain chat TTS uses (OpenAI, edge-tts, Piper; pinned by CORVIN_TTS_PROVIDER or the voice settings). The only engine since 1.8.0; openai and gtts are kept so that a record which stored them still validates, and both mean auto (src/skill.py LEGACY_TTS_ENGINES)
    penpot_runtime:
      type: string
      enum: [auto, docker, podman]
      default: auto
      description: Container runtime for the optional Penpot design stack (scripts/penpot_stack) -- auto (docker first, then podman), docker or podman; a forced runtime is never swapped for another. Sent to the CLI as --runtime. Docker pulls can fail on hosts whose registry access is blocked; then pick podman, which already holds the pinned images
    youtube_upload_supported:
      type: boolean
      default: false
      description: YouTube export is not built (the console route answers 501) -- always false until a future task implements it
    max_video_length_minutes:
      type: integer
      default: 60
      minimum: 1
      maximum: 60
      description: Upper bound for a produced video (also enforced server-side against the measured, not estimated, narration length)
    audit_enabled:
      type: boolean
      default: true
      description: Hash-chain every production step
console_panel:
  label: CorvinTV
  route: video-producer
  icon: Video
  group: marketplace
  element_kind: react-component
  component: VideoProducerPage
# Learning loops this plugin contributes (CorvinOS ADR-0906). The operator's per-scene approvals and ratings are
# learning events of the owner skill; the console measures this loop from those events and shows the
# plugin's row on Learnings -> Learning Loops. The Learning tab of a finished video is where they are given.
learning_loops:
  - id: scene_feedback
    description: Operator approvals and 1-5 ratings of produced scenes, read back as measured quality of the production variants
    event_source: FeedbackEvent.quality_rating
    feedback_types:
      - outcome_feedback
      - confidence_score
    aggregation: rolling_mean_7d
    health_threshold: null
    dormancy_alert_hours: 168
    owner_skill: os.video_producer
