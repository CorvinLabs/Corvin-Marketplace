# Example Plugin: Simple Router Backend
# This is a reference implementation showing best practices.
# See PLUGIN_DEVELOPMENT.md for detailed guide.

plugin: "1.0"

# Identity
id: "com.corvinlabs.example-router"
name: "Example Router Backend"
version: "1.0.0"

# Core metadata
description: |
  Reference router backend plugin demonstrating:
  - Message routing based on keywords
  - Proper error handling (never raise)
  - Health check implementation
  - Test coverage (unit + wiring)

author: "CorvinOS Team"
email: "plugins@corvin-labs.com"
license: "Apache-2.0"
homepage: "https://github.com/CorvinLabs/Corvin-Marketplace"
repository: "https://github.com/CorvinLabs/Corvin-Marketplace"

# Implementation
entry_point: "plugin.py::ExampleRouterBackend"
plugin_type: "router_backend"

# CorvinOS integration
origin: "community"
boot_layer: "installed"

# Compatibility
min_corvin_version: "0.10.0"
max_corvin_version: null

# Permissions & risk profile
permissions:
  network_egress: []              # No network access
  pii_risk: "none"                # No PII handled
  data_locality: "local"          # In-process only
  audit_logging: true

# Dependencies
dependencies: []
requires: []

# Metadata for discovery
keywords:
  - "router"
  - "example"
  - "reference"

categories:
  - "utility"

supports_auto_update: false
health_check_interval: 60
