[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "corvin-example-router-backend"
version = "1.0.0"
description = "Example router backend plugin for CorvinOS"
authors = [{name = "CorvinOS Team", email = "plugins@corvin-labs.com"}]
license = {text = "Apache-2.0"}
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.10",
]

# Entry points for plugin discovery
# Must match the entry_point in manifest.yaml
[project.entry-points."corvin.plugins"]
example-router = "plugin:ExampleRouterBackend"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["."]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
