[pytest]
# Pytest configuration for Video Producer plugin tests

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    integration: Integration tests
    slow: Slow running tests
    security: Security tests
    e2e: End-to-end tests

# Output
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Coverage
[coverage:run]
branch = True
source = src/video_producer

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
