<!doctype html>
<meta charset=utf-8>
<link rel="stylesheet" href="../css/fonts.css">
<link rel="stylesheet" href="../css/base.css">
<div class="slide" style="justify-content: center; align-items: center;">
  <div class="stat animate-fade-in">$number</div>
  <div class="stat-label animate-fade-in" style="animation-delay: 0.4s;">$label</div>
  <p class="animate-fade-in" style="animation-delay: 0.8s; font-size: 18px; max-width: 1000px; margin-top: 60px;">$description</p>
</div>
