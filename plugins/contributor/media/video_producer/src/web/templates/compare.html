<!doctype html>
<meta charset=utf-8>
<link rel="stylesheet" href="../css/fonts.css">
<link rel="stylesheet" href="../css/base.css">
<div class="slide">
  <h2 class="animate-fade-in">$title</h2>
  <div style="display: flex; gap: 80px; margin-top: 60px; width: 100%;">
    <div style="flex: 1;" class="animate-fade-in">
      <h3 style="color: var(--accent); font-size: 36px;">$left_title</h3>
      <p style="margin-top: 30px;">$left_content</p>
    </div>
    <div style="flex: 1;" class="animate-fade-in" style="animation-delay: 0.4s;">
      <h3 style="color: var(--accent); font-size: 36px;">$right_title</h3>
      <p style="margin-top: 30px;">$right_content</p>
    </div>
  </div>
</div>
