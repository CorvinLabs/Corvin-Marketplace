plugin_id: video_producer
plugin_type: web_surface
version: 1.0.0
display_name: Video Producer
description: "Create short narrated MP4s from a task description: LLM-written storyboard,
  per-scene gTTS narration, ffmpeg assembly. Contributor plugin: installs from this
  checkout, enabling records the operator's consent. See docs/ADR-0953 for the
  current (consolidated) scope versus earlier design plans."

origin: community
boot_layer: installed
locality: local
network_egress: external
egress_hosts:
  # gTTS narration (every job) + optional Anthropic storyboard backend, gated
  # by the console's own L34/L35 pre-spawn checks before each job starts.
  # Not api.openai.com / googleapis.com -- those were for the never-built
  # OpenAI-TTS and YouTube-upload paths (ADR-0953).
  - translate.google.com
  - api.anthropic.com
pii_risk: low
requires_consent: true
audit_required: true
infrastructure_plugin: false
orchestration_support: true
settings_schema:
  type: object
  properties:
    tts_engine:
      type: string
      enum: [gtts]
      default: gtts
      description: Text-to-speech engine for narration (only gtts is implemented; ADR-0953 Phase B evaluated and rejected adopting the openai/piper code paths as-is)
    youtube_upload_supported:
      type: boolean
      default: false
      description: YouTube export is not built (the console route answers 501) -- always false until a future task implements it
    max_video_length_minutes:
      type: integer
      default: 60
      minimum: 1
      maximum: 60
      description: Upper bound for a produced video (also enforced server-side against the measured, not estimated, narration length)
    audit_enabled:
      type: boolean
      default: true
      description: Hash-chain every production step
console_panel:
  label: Video Producer
  route: video-producer
  icon: Video
  group: marketplace
  element_kind: react-component
  component: VideoProducerPage
