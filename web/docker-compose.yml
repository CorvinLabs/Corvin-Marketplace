version: '3.8'

services:
  marketplace-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: corvin-marketplace-web
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
    volumes:
      # Mount the plugins directory for live plugin updates
      - ../plugins:/app/plugins:ro
      - ../index:/app/index:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Optional: Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: corvin-marketplace-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - marketplace-web
    restart: unless-stopped
