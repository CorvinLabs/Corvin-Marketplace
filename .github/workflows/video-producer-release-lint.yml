# Release lint for the Video Producer plugin (ADR-2247 doc_claims, PLAN-0946 R5, T-0094).
# First proves the lint still catches the three historical defects (version mismatch, placeholder
# token, nonexistent test name - fixtures under tests/fixtures/release_lint/), then lints the plugin
# and the marketplace index as they are. Standard library only; no network beyond the checkout.
name: video-producer release lint

on:
  push:
    paths:
      - "plugins/buildin/media/corvintv/**"
      - "index/plugins.json"
      - ".github/workflows/video-producer-release-lint.yml"
  pull_request:
    paths:
      - "plugins/buildin/media/corvintv/**"
      - "index/plugins.json"
      - ".github/workflows/video-producer-release-lint.yml"

permissions:
  contents: read

jobs:
  release-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: plugins/buildin/media/corvintv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Positive controls - every historical defect is caught
        run: |
          set -u
          for c in version_index version_provider placeholder missing_test; do
            f=tests/fixtures/release_lint/$c
            if python scripts/release_lint.py --plugin-dir "$f/plugin" --index "$f/index/plugins.json"; then
              echo "::error::release_lint did not catch the $c fixture"
              exit 1
            fi
          done
      - name: Negative control - a consistent plugin passes
        run: |
          f=tests/fixtures/release_lint/clean
          python scripts/release_lint.py --plugin-dir "$f/plugin" --index "$f/index/plugins.json"
      - name: Lint the plugin and the marketplace index
        run: python scripts/release_lint.py --index ../../../../index/plugins.json
      - name: Unit tests of the lint
        run: |
          python -m pip install --quiet "pytest>=7"
          python -m pytest tests/test_release_lint.py -q -o addopts="" -p no:cacheprovider
